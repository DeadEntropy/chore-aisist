# Template for the deployment folder (<deploy-dir>/chore-aisist/docker-compose.yml)
# Copy this folder there, fill in .env, then:
#   docker compose up -d chore-aisist-db
#   docker compose run --rm chore-aisist migrate
#   # fresh database only: load people and chores first (the scheduler's runs need them), see README.md
#   docker compose run --rm -v ./catalog.json:/tmp/catalog.json:ro chore-aisist import /tmp/catalog.json
#   mkdir -p <backup-folder> && chown <APP_UID> <backup-folder>   # else Docker creates it root-owned
#   docker compose up -d                  # starts the scheduler (re-plans every day at PLAN_TIMES)
# After editing .env, run `docker compose up -d` again: the running container keeps the settings it started with.

services:
  chore-aisist-db:
    image: mariadb:11
    container_name: chore-aisist-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: chores
      MARIADB_USER: chore_aisist
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: America/New_York
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"   # this machine only; for running the code from the dev checkout
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The app: runs the scheduler (`planner serve`). Other commands go to the running container:
  #   docker compose exec chore-aisist planner status
  # or, e.g. for migrate before the first start, a one-off container:
  #   docker compose run --rm chore-aisist migrate
  chore-aisist:
    image: chore-aisist:0.1.0     # build from this repo: docker build --build-arg APP_UID=$(id -u) -t chore-aisist:0.1.0 .
    container_name: chore-aisist
    command: ["serve"]
    restart: unless-stopped
    healthcheck:                  # healthy = a planning run succeeded in the last 26 hours
      test: ["CMD", "planner", "health"]
      interval: 5m
      timeout: 30s
      start_period: 2m
      retries: 1
    depends_on:
      chore-aisist-db:
        condition: service_healthy
    environment:
      DB_HOST: chore-aisist-db
      DB_PORT: 3306
      DB_NAME: chores
      DB_USER: chore_aisist
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: America/New_York
      PLANNER_TIMEZONE: America/New_York
      # Calendars are optional: leave CALDAV_URL unset in .env for database-only use.
      CALDAV_URL: ${CALDAV_URL:-}
      CALDAV_CA_CERT: ${HOMELAB_CA_CERT:+/certs/homelab-ca.crt}   # empty → system certificates
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_APP_PASSWORD: ${NEXTCLOUD_APP_PASSWORD:-}
      BUSY_CALENDARS: ${BUSY_CALENDARS:-}
      EVENT_BUFFER_MINUTES: ${EVENT_BUFFER_MINUTES:-30}
      CHORE_WINDOWS: ${CHORE_WINDOWS:-sat 08:00-18:00; sun 08:00-18:00}
      EXTRA_DAY_WINDOW: ${EXTRA_DAY_WINDOW:-08:00-18:00}
      TRAVEL_KEYWORDS: ${TRAVEL_KEYWORDS:-travel,trip,away}
      NO_CHORES_KEYWORDS: ${NO_CHORES_KEYWORDS:-no chores}
      DAY_OFF_KEYWORDS: ${DAY_OFF_KEYWORDS:-day off,holiday}
      CHORE_TIME_KEYWORDS: ${CHORE_TIME_KEYWORDS:-chore}
      CALDAV_TIMEOUT_SECONDS: ${CALDAV_TIMEOUT_SECONDS:-30}
      CHORES_CALENDAR_URI: ${CHORES_CALENDAR_URI:-chores}
      REMINDER_MINUTES: ${REMINDER_MINUTES:-30}
      PLAN_TIMES: ${PLAN_TIMES:-20:00}
      # Weather for outdoor chores: optional, leave WEATHER_LATITUDE unset in .env for none.
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-}
      WEATHER_DAYS: ${WEATHER_DAYS:-10}
      WEATHER_MODELS: ${WEATHER_MODELS:-ecmwf_ifs025,best_match}
      MAX_RAIN_PERCENT: ${MAX_RAIN_PERCENT:-20}
      MAX_FEELS_LIKE_C: ${MAX_FEELS_LIKE_C:-35}
      MAX_UV_INDEX: ${MAX_UV_INDEX:-7}
      BACKUP_DIR: /backups                                      # a dump before every scheduled run
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    extra_hosts:
      # The server may not resolve Nextcloud's name, and its certificate only covers the name, not the IP.
      # NEXTCLOUD_HOST must match the host in CALDAV_URL.
      - "${NEXTCLOUD_HOST:-nextcloud.local}:${NEXTCLOUD_IP:-127.0.0.1}"
    volumes:
      - ${HOMELAB_CA_CERT:-/dev/null}:/certs/homelab-ca.crt:ro   # CA that signed Nextcloud's certificate
      # Backups: preferably on another disk than ./db, writable by the image's user (APP_UID at build, default 1000)
      - ${BACKUP_FOLDER:-./backups}:/backups
